[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained, pulled in by the optional GUI backends" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz: unmaintained, pulled in by the optional GUI backends' text stacks" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: unmaintained, pulled in by the optional GUI backends' text stacks" },
    { id = "RUSTSEC-2026-0370", reason = "zvariant: unmaintained only; Slint/AccessKit require zbus 5 and zvariant 5. No patched standalone release exists; remove when these upstreams adopt zbus 6 wire types (z-galaxy/zbus#2043)." },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: unmaintained only; Slint/AccessKit require zbus 5, which requires zbus_names 4. No patched standalone release exists; remove when these upstreams adopt zbus 6 names (z-galaxy/zbus#2043)." },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: unmaintained only; required by the zvariant 5 used by Slint/AccessKit. No patched standalone release exists; remove when these upstreams adopt zbus 6 derives (z-galaxy/zbus#2043)." },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

[sources.allow-org]
github = ["guinea-rs", "uniproc-dev"]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
exceptions = [
    { crate = "slint", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "slint-macros", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-backend-selector", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-backend-winit", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-common", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-compiler", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-core", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-core-macros", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-renderer-femtovg", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-renderer-skia", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "i-slint-renderer-software", allow = ["LicenseRef-Slint-Royalty-free-2.0"] },
    { crate = "ksni", allow = ["Unlicense"] },
    { crate = "libfuzzer-sys", allow = ["NCSA"] },
]

[licenses.private]
ignore = true
