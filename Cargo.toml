[workspace]
members = ["crates/guicons", "crates/guicons-build", "crates/guicons-cli", "crates/guicons-core", "crates/guicons-macros", "crates/guicons-net"]
resolver = "3"

[workspace.package]
version = "0.16.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Tam1SH/guicons"

[profile.dev]
debug = 0

[profile.test]
debug = 0

[profile.release]
debug = 0

[profile.bench]
debug = 0
