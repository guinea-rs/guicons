name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancels a stale run when new commits land on the same branch/PR - avoids
# burning CI minutes on a build for a diff that's already been superseded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # `--all-targets` (tests/benches/examples using only default
      # features) but not `--all-features` - the `slint`/`iced` GUI
      # features pull in real windowing-toolkit deps that need extra
      # system packages on Linux runners, and aren't part of what this
      # workflow is meant to gate (guicons-cli and the manifest/codegen
      # core are the parts every change here actually touches).
      - name: Build
        run: cargo build --workspace --all-targets

      - name: Test
        run: cargo test --workspace
