name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

env:
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: "-C link-arg=/DEBUG:NONE"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    uses: guinea-rs/.github/.github/workflows/deps-audit.yml@02c22ffa63298c80099e037effd27005e0e78939
    with:
      manifests: '["Cargo.toml"]'

  fixtures:
    uses: ./.github/workflows/e2e.yml

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99.1"

      - name: Verify compiler version
        shell: bash
        run: |
          rustc --version
          test "$(rustc --version | cut -d' ' -f2)" = "1.99.1"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Build
        run: cargo build --workspace --all-targets --locked

      - name: Test
        run: cargo test --workspace --locked

  features:
    strategy:
      fail-fast: false
      matrix:
        feature: [slint, iced, egui, windows-reactor]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99.1"

      - name: Verify compiler version
        shell: bash
        run: |
          rustc --version
          test "$(rustc --version | cut -d' ' -f2)" = "1.99.1"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          key: ${{ matrix.feature }}

      - name: Check
        env:
          GUICONS_ALLOW_NETWORK: "1"
        run: cargo check -p guicons --all-targets --features "macros ${{ matrix.feature }}" --locked

      - name: Test WinUI adapter
        if: matrix.feature == 'windows-reactor'
        run: cargo test -p guicons --lib --features windows-reactor --locked

  msrv:
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: "1.95.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.95.0"

      - name: Verify MSRV compiler version
        shell: bash
        run: |
          rustc --version
          test "$(rustc --version | cut -d' ' -f2)" = "1.95.0"

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0

      - name: Check
        run: cargo check --workspace --locked
