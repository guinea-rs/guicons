name: E2E (fixture builds)

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-inputs:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.check.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
          persist-credentials: false

      - id: check
        shell: bash
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] ||
             ! git cat-file -e "${BASE_REF}^{commit}" 2>/dev/null ||
             ! git diff --quiet "$BASE_REF" HEAD -- Cargo.toml Cargo.lock rust-toolchain.toml crates .github/workflows/ci.yml .github/workflows/e2e.yml; then
            echo "required=true" >> "$GITHUB_OUTPUT"
          else
            echo "required=false" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    needs: check-inputs
    if: needs.check-inputs.outputs.required == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de
        with:
          toolchain: "1.99.1"

      - name: Verify compiler version
        shell: bash
        run: |
          rustc --version
          test "$(rustc --version | cut -d' ' -f2)" = "1.99.1"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      # The fixture crates pull in `slint`, which needs `fontconfig` at
      # build time (via `yeslogic-fontconfig-sys`, a system lib found
      # through pkg-config) - not something `ci.yml`'s own ubuntu job ever
      # needed, since the fixtures live outside the main workspace and
      # only this nested build actually compiles them.
      - name: Install slint build/runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev pkg-config xvfb libxkbcommon-x11-0

      # One of the fixture's own tests actually instantiates a real Slint
      # `AppWindow` (proving the codegen'd .slint is valid, not just that
      # it compiles) - winit needs a live X/Wayland display for that even
      # with software rendering, which a headless runner doesn't have.
      # xvfb-run gives it a fake one.
      - name: Run fixture e2e tests
        run: xvfb-run -a cargo test -p guicons-build --test fixture_crates --locked -- --ignored
