[package]
name = "guicons"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Manifest-driven icon system for native Rust GUI applications"

[features]
default = ["macros"]
macros = ["dep:guicons-macros"]
slint = ["dep:slint", "dep:image", "guicons-macros?/slint"]
iced = ["dep:iced", "guicons-macros?/iced"]
windows-reactor = ["dep:windows-reactor", "guicons-macros?/windows-reactor"]
egui = ["dep:egui", "guicons-macros?/egui"]

[dependencies]
guicons-macros = { path = "../guicons-macros", version = "0.11.0", optional = true }
slint = { version = "1.15.1", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
iced = { version = "0.14", optional = true, features = ["svg", "image"] }
windows-reactor = { package = "windows-reactor-pre", version = "0.101.0", optional = true }
egui = { version = "0.36", optional = true, default-features = false }

[[example]]
name = "slint_icon"
required-features = ["slint"]

[[example]]
name = "iced_icon"
required-features = ["iced"]
